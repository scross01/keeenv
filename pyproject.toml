[project]
name = "keeenv"
dynamic = ["version"]
description = "Set local environments variables from Keepass"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pykeepass>=4.1.1.post1",
]

[project.scripts]
keeenv = "keeenv.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "keeenv/__init__.py"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "B904",   # raise-from — codebase uses constructor-based exception chaining
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM300", "SIM117"]
"keeenv/core.py" = ["SIM102"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
