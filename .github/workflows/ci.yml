name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Set up Python
        run: |
          uv python pin 3.14
          uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check keeenv tests

      - name: Check formatting
        run: uv run ruff format --check keeenv tests

      - name: Run tests
        run: uv run pytest tests -q
